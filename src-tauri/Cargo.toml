[package]
name = "isshin-tools"
version = "1.0.5"
description = "Isshin Tools — personal desktop utility client"
authors = ["Isshin"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc"] }
rand = "0.8"
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
md-5 = "0.10.6"
uuid = { version = "1.20.0", features = ["v4"] }
