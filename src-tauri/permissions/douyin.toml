[[permission]]
identifier = "allow-douyin"
description = "Allow Douyin login, works/likes listing, unlike, and video download"
commands.allow = [
  "douyin_open_login",
  "douyin_hide_login",
  "douyin_logout",
  "douyin_profile",
  "douyin_list_aweme",
  "douyin_unlike",
  "douyin_download",
  "douyin_list_downloaded",
  "douyin_cache_preview",
  "douyin_apply_aweme_seq",
]
